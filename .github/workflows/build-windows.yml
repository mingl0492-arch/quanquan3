name: Build Windows Portable Folder

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build fast portable folder
        run: npm run release:win

      - name: Upload portable folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: quanquan-goal-manager-fast-portable-folder
          path: release/win-unpacked
